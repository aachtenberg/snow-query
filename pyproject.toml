[project]
name = "snowq"
version = "0.1.0"
description = "Query ServiceNow's REST APIs by reusing an SSO browser session instead of API credentials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
# Pull cookies straight out of an installed browser's cookie store.
browser = ["browser-cookie3>=0.19"]
# Drive a real browser through the SSO login and save the session.
login = ["playwright>=1.44"]
all = ["browser-cookie3>=0.19", "playwright>=1.44"]

[project.scripts]
snowq = "snowq.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snowq"]
